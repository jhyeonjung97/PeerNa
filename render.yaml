# Two services from one repository.
#
#   peerna      the real one. Deploys only when a release is made
#               (tests/release.sh): autoDeploy is off, so a push to main alone
#               changes nothing that anyone is using.
#   peerna-dev  the development copy, on the free plan. Every push to the dev
#               branch deploys it. It admits the operator's account only.
#
#
# A container, not a serverless function: a review runs for minutes (median
# 425 s, one measured at 2303 s under rate limiting) in a background thread,
# and a platform that freezes the instance after the response would kill it.

services:
  - type: web
    name: peerna
    runtime: docker
    plan: starter          # the free plan sleeps when idle, which ends a review in flight
    healthCheckPath: /healthz
    branch: main
    autoDeploy: false      # released by hand; see tests/release.sh

    disk:
      name: peerna-data
      mountPath: /data     # HOME in the container: index, checkpoints, job history
      sizeGB: 2            # the corpus index alone is 381 MB

    envVars:
      # Set the value in the Render dashboard, never here. sync: false keeps it
      # out of the repository and out of every build log.
      - key: OPENAI_API_KEY
        sync: false
      # Only if the Claude models are to be offered.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PEER_REVIEWER_MODEL
        value: luna
      # Contact address sent to Crossref with reference lookups. Set in the dashboard.
      - key: AI_PEER_REVIEWER_CONTACT
        sync: false
      # Addresses that are not rationed, comma-separated. Set in the dashboard.
      - key: AI_PEER_REVIEWER_UNLIMITED
        sync: false
      # Uncomment only with an agreement actually in place; it refuses the
      # models that would make the claim false.
      # - key: AI_PEER_REVIEWER_ZERO_RETENTION
      #   value: "1"

  - type: web
    name: peerna-dev
    runtime: docker
    # Free: no disk, so job history and checkpoints go with each restart, and
    # no corpus index; and it sleeps after fifteen idle minutes. All acceptable
    # for checking a change in the real container before it is released. The
    # corpus-dependent work is tested on the laptop, which has the index.
    plan: free
    healthCheckPath: /healthz
    branch: dev
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_PEER_REVIEWER_MODEL
        value: luna
      - key: AI_PEER_REVIEWER_CONTACT
        sync: false
      # The only account that may sign in. Without Google settings as well,
      # nobody can; see auth.ONLY.
      - key: AI_PEER_REVIEWER_ONLY
        sync: false
      - key: AI_PEER_REVIEWER_UNLIMITED
        sync: false
