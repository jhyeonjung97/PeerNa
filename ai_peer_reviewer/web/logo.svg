<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PeerNa">
  <title>PeerNa</title>
  <!--
    A bud seen from above, mid-opening: each petal is a sheet of paper, folded
    at one corner the way a page is. The manuscript is what blooms.

    Drawn on a 64-unit grid with heavy strokes so it survives being shrunk to a
    16px favicon, where thin lines and small detail disappear. currentColor
    everywhere, so it inherits the page's ink in light and dark alike.
  -->
  <g fill="none" stroke="currentColor" stroke-width="3.4"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- four petals, each a page rotated about the centre -->
    <g>
      <path d="M32 30 L32 8 L44 12 L44 30 Z"/>
      <path d="M44 12 L38.5 14 L38.5 8.3" stroke-width="2.2"/>
    </g>
    <g transform="rotate(90 32 32)">
      <path d="M32 30 L32 8 L44 12 L44 30 Z"/>
      <path d="M44 12 L38.5 14 L38.5 8.3" stroke-width="2.2"/>
    </g>
    <g transform="rotate(180 32 32)">
      <path d="M32 30 L32 8 L44 12 L44 30 Z"/>
      <path d="M44 12 L38.5 14 L38.5 8.3" stroke-width="2.2"/>
    </g>
    <g transform="rotate(270 32 32)">
      <path d="M32 30 L32 8 L44 12 L44 30 Z"/>
      <path d="M44 12 L38.5 14 L38.5 8.3" stroke-width="2.2"/>
    </g>

    <!-- the centre: still closed, the part under review -->
    <circle cx="32" cy="32" r="5.2"/>
  </g>
</svg>
